name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test sync script
        run: python3 -m unittest discover -s scripts

      - name: Verify vendored upstream copy is unmodified
        run: python3 scripts/upstream_sync.py verify
